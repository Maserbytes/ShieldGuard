name: Build and Release ShieldGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Install
        run: cp app/build/outputs/apk/debug/app-debug.apk ShieldGuard.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-APK
          path: ShieldGuard.apk

      - name: Create Instant GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "ShieldGuard Latest Build"
          body: |
            ### 🛡️ ShieldGuard Glassy APK
            - Direct download for your Android phone.
            - Tap **ShieldGuard.apk** below to download and install.
          draft: false
          prerelease: false
          files: ShieldGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
